<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mencoba membuat popup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        body {
            background-color: rgb(4, 13, 19);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #btn-popup {
            font-size: 1.5rem;
            font-weight: 550;
            cursor: pointer;
            padding: 8px 16px;
            color: white;
            background-color: #38bdf8;
            border-radius: 6px;
            border: none;
        }
    </style>
</head>

<body>
    <button type="button" id="btn-popup">Pop Up Here</button>
</body>

</html>
