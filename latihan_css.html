<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>latihan css</title>
    <style type="text/css">
      * {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
        user-select: none;
      }

      .judul {
        text-align: center;
        transition: all 0.2s ease-in-out;
        cursor: default;

        &:hover {
          font-style: italic;
        }
      }

      p {
        color: transparent;
        background: linear-gradient(to right, red, green, blue);
        background-clip: text;
        font-size: larger;
      }
      #gaya {
        color: blue;
        transition: all 0.2s ease-in-out;
        width: max-content;
        border: 1px solid black;
        border-radius: 15px;
        padding: 10px;
      }
      #gaya:hover {
        box-shadow: 2px 2px 5px black;
        transform: scale(1.02);
        cursor: pointer;
      }

      #gaya .title {
        font-style: oblique;
        font-size: large;
        color: red;
        text-decoration: underline;
      }

      #container {
        text-align: center;
      }

      .btn-plus {
        padding: 5px;
        background-color: transparent;
        font-size: medium;
        border-radius: 15px;
        border: 1px solid black;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1 class="judul">GOOD AFTERNOON</h1>
    <p>
      Lorem ipsum dolor sit amet, consectetur adipisicing elit. Sunt
      perspiciatis soluta deserunt laborum iure cupiditate officia amet error.
      Fuga pariatur fugiat a incidunt voluptate eos, sunt quae minus tempore
      maiores?
    </p>
    <div id="gaya">
      teks dengan selektor gaya
      <span class="title"> testing </span>
    </div>

  </body>
</html>
