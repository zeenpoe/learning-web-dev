<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropdown menu</title>

    <style>
        * {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 0;
        }

        nav {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            padding: 10px 35px;
            background-color: #333;
            color: white;
        }

        ul {
            padding: 0;
            list-style: none;

            display: flex;
            flex-direction: row;
            gap: 20px;
        }

        li:hover {
            cursor: pointer;
            text-decoration: underline;
        }

        .dropdown-menu {
            display: none;
            flex-direction: column;
            position: absolute;
            z-index: 1;
            background-color: #333;
        }

        .dropdown:hover .dropdown-menu {
            display: flex;
        }

        .dropdown-menu a {
            color: white;
            text-decoration: none;
            padding: 10px 17.5px;
        }

        .dropdown-menu a:hover {
            background-color: #535252;
        }
    </style>
</head>

<body>
    <nav>
        <h1>MyWebsite</h1>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li class="dropdown">
                Services
                <div class="dropdown-menu">
                    <a href="">Design</a>
                    <a href="">SEO</a>
                    <a href="">Marketing</a>
                </div>
            </li>
            <li class="dropdown">
                Contact
                <div class="dropdown-menu">
                    <a href="">Whatsapp</a>
                    <a href="">Email</a>
                    <a href="">Alamat</a>
                </div>
            </li>
        </ul>
    </nav>
</body>

</html>
